# PC Movie Theater player keys — modeled on YouTube
SPACE cycle pause
k cycle pause
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT ignore
f cycle fullscreen
F11 cycle fullscreen
ESC script-binding pmt/esc
GAMEPAD_ACTION_RIGHT script-binding pmt/esc

LEFT seek -5
RIGHT seek 5
j seek -10
l seek 10
PGUP seek 60
PGDWN seek -60
HOME seek 0 absolute
END seek 100 absolute-percent
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent
, frame-back-step
. frame-step

UP add volume 5
DOWN add volume -5
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
m cycle mute

c cycle sub
C cycle sub down
a cycle audio
< add speed -0.25
> add speed 0.25
BS set speed 1
z add sub-delay -0.1
x add sub-delay 0.1
+ add sub-scale 0.1
- add sub-scale -0.1

N playlist-next
P playlist-prev
n playlist-next
p playlist-prev
i script-binding stats/display-stats-toggle
q quit

# window sizing (windowed mode): drag any edge/corner freely, or use these
Alt+1 set window-scale 0.5
Alt+2 set window-scale 1
Alt+3 set window-scale 1.5
Alt+4 set window-scale 2
Ctrl+WHEEL_UP add window-scale 0.1
Ctrl+WHEEL_DOWN add window-scale -0.1
Alt+ENTER cycle window-maximized

# audio sync (voices behind/ahead of the picture)
[ add audio-delay -0.1
] add audio-delay 0.1
Ctrl+BS set audio-delay 0
